# Pipeline configuration for binary star light curve modelling.
# Run with: python main.py example_config.ini
# Run specific stages only: python main.py example_config.ini --stages desc ephemeris

[paths]
# Root directory where all per-target subdirectories are created.
# Each target gets its own subdirectory: <data_root>/<name>/
data_root    = /data/dir

# FITS file containing ULTRACAM photometry (used by DESC stage)
ultracam_dat = /path/to/MY_TARGET_ultracam.fits

# FITS file containing NGTS photometry (used by EPHEMERIS stage)
ngts_dat     = /path/to/MY_TARGET_ngts.fits

# Base lcurve model file used as the starting template for DESC.
# This file provides the initial parameter layout before fitting.
example_model = /path/to/LCURVE/example/model/file
[target]
# Short identifier used for file and directory naming
name    = MY_TARGET

# Gaia source ID (can be the same as name if preferred)
gaia_id = MY_TARGET

[ephemeris]
# Initial orbital period in days (can be approximate — refined by EPHEMERIS stage)
period = 0.065432

# Reference time of inferior conjunction in BJD TDB
t0     = 2458765.432100

[star]
# White dwarf effective temperature (K)
teff1  = 10000

# White dwarf log surface gravity (cgs)
logg1  = 7.50

# White dwarf spectral type: DA or DB
wdtype = DA

# Companion effective temperature (K)
teff2  = 3000

# Companion log surface gravity (cgs)
logg2  = 5.00

[model]
# Number of raw data points per phase bin
binfact  = 100

# Orbital semi-major axis in solar radii (from RV solution or spectral analysis)
a_r_sun  = 0.85
